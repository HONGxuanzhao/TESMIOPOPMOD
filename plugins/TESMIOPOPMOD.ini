; Safe, version-locked population patch.
; It changes only three resident-birth factors and one resident death-candidate
; factor. Age, health, food, housing, education, migration, escape, and the
; generic removal/statistics paths remain native.
[TESMIOPOPMOD]
; Optional adapter for verified Reputation 2.1; absent provider keeps base formulas.
reputation_compat_enabled=1
enabled=1
birth_base_factor=0.4
birth_research_increase_factor=1.22
birth_research_decrease_factor=0.70
; Native q = (0.15 * u3 + 0.85) * u1 * u2 in one 0x4C resident branch.
; This replaces only the native 0.85 addend; 0.85 is the unchanged default.
; Recommended test range: 0.70..1.00. Accepted range: 0..2.
death_candidate_base_factor=0.85
